pluginManagement {
    repositories {
        // 【关键修改】把 Forge 官方源放在第一位！
        // 确保 ForgeGradle 插件能直接从源头下载，避开镜像源缺文件的问题
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }

        // 2. 阿里云 (加速通用插件，如 org.gradle.toolchains)
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }

        // 3. BMCLAPI (作为 Forge 库的备选加速，放在官方源之后)
        maven { url 'https://bmclapi2.bangbang93.com/maven' }

        // 4. Gradle 官方插件中心 (兜底)
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'forge-1.20.1-47.4.0-mdk'