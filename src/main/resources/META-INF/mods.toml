modLoader="javafml"
loaderVersion="[47,)"

license="All Rights Reserved"

[[mods]]
modId="elementalcraft"
version="${mod_version}"
displayName="ElementalCraft: Reactions"
logoFile="logo.png"
authors="XuLai"
description='''${mod_description}'''

# -----------------------------------------------------------------------
# Dependencies / 依赖项配置
# -----------------------------------------------------------------------

# 1. Forge 依赖 (Forge Dependency)
[[dependencies.elementalcraft]]
    modId="forge"
    mandatory=true
    versionRange="[47.4.0,)"
    ordering="NONE"
    side="BOTH"

# 2. Minecraft 依赖 (Minecraft Dependency)
[[dependencies.elementalcraft]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1]"
    ordering="NONE"
    side="BOTH"

# 3. Jade 依赖 (Jade Dependency) - [Optional]
# Jade 仅用于悬浮提示展示（JadePlugin），未安装时本模组功能不受影响
# Optional: only used for the overlay tooltip (JadePlugin); the mod works without it
[[dependencies.elementalcraft]]
    modId="jade"
    mandatory=false        # false = 未安装也能启动 / false = works without it
    versionRange="[11.12.3,)" # 指定版本范围 / Specified version range
    ordering="AFTER"       # 在 Jade 之后加载 / Load after Jade
    side="CLIENT"          # 仅客户端展示 / Client-side display only

# -----------------------------------------------------------------------

[[plugins]]
modId = "elementalcraft"
class = "com.xulai.elementalcraft.JadePlugin"